<svg viewBox="0 0 1280 400" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0d1b3e"/>
      <stop offset="100%" style="stop-color:#0a0e1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0078d4"/>
      <stop offset="100%" style="stop-color:#00bcf2"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00bcf2;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <linearGradient id="linegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0078d4;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#0078d4;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#00bcf2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00bcf2;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg)"/>

  <!-- Glow blobs -->
  <ellipse cx="200" cy="200" rx="300" ry="200" fill="#0078d4" opacity="0.08" filter="url(#blur)"/>
  <ellipse cx="1080" cy="200" rx="300" ry="200" fill="#00bcf2" opacity="0.08" filter="url(#blur)"/>
  <ellipse cx="640" cy="380" rx="400" ry="150" fill="#0078d4" opacity="0.06" filter="url(#blur)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#4fc3f7" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="480" y1="0" x2="480" y2="400"/>
    <line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="960" y1="0" x2="960" y2="400"/>
    <line x1="1120" y1="0" x2="1120" y2="400"/>
  </g>

  <!-- Hexagon decorations left -->
  <g opacity="0.15">
    <polygon points="60,120 90,103 120,120 120,154 90,171 60,154" fill="none" stroke="#0078d4" stroke-width="1"/>
    <polygon points="20,170 45,156 70,170 70,198 45,212 20,198" fill="none" stroke="#00bcf2" stroke-width="1"/>
    <polygon points="100,200 120,189 140,200 140,222 120,233 100,222" fill="none" stroke="#0078d4" stroke-width="0.8"/>
    <polygon points="40,240 65,226 90,240 90,268 65,282 40,268" fill="none" stroke="#00bcf2" stroke-width="0.8"/>
  </g>

  <!-- Hexagon decorations right -->
  <g opacity="0.15">
    <polygon points="1160,120 1190,103 1220,120 1220,154 1190,171 1160,154" fill="none" stroke="#00bcf2" stroke-width="1"/>
    <polygon points="1190,180 1215,166 1240,180 1240,208 1215,222 1190,208" fill="none" stroke="#0078d4" stroke-width="1"/>
    <polygon points="1130,230 1150,219 1170,230 1170,252 1150,263 1130,252" fill="none" stroke="#00bcf2" stroke-width="0.8"/>
    <polygon points="1200,260 1225,246 1250,260 1250,288 1225,302 1200,288" fill="none" stroke="#0078d4" stroke-width="0.8"/>
  </g>

  <!-- Shield icon -->
  <g transform="translate(530, 80)">
    <path d="M60 10 L110 30 L110 75 C110 100 60 120 60 120 C60 120 10 100 10 75 L10 30 Z" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
    <path d="M60 20 L100 36 L100 74 C100 93 60 108 60 108 C60 108 20 93 20 74 L20 36 Z" fill="url(#glow)" opacity="0.5"/>
    <!-- Checkmark inside shield -->
    <polyline points="40,68 55,83 82,52" fill="none" stroke="#00bcf2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main title -->
  <text x="640" y="230" text-anchor="middle" font-size="48" font-weight="700" letter-spacing="2" fill="white">Microsoft Entra ID</text>
  <text x="640" y="285" text-anchor="middle" font-size="32" font-weight="300" letter-spacing="6" fill="url(#accent)">CONDITIONAL ACCESS LAB</text>

  <!-- Divider line -->
  <rect x="340" y="305" width="600" height="1.5" fill="url(#linegrad)"/>

  <!-- Subtitle tags -->
  <g transform="translate(345, 325)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="120" height="28" rx="14" fill="#0078d4" opacity="0.2"/>
    <rect x="0" y="0" width="120" height="28" rx="14" fill="none" stroke="#0078d4" stroke-width="1"/>
    <text x="60" y="19" text-anchor="middle" font-size="12" fill="#4fc3f7" letter-spacing="1">ZERO TRUST</text>
    <!-- Tag 2 -->
    <rect x="135" y="0" width="100" height="28" rx="14" fill="#0078d4" opacity="0.2"/>
    <rect x="135" y="0" width="100" height="28" rx="14" fill="none" stroke="#00bcf2" stroke-width="1"/>
    <text x="185" y="19" text-anchor="middle" font-size="12" fill="#4fc3f7" letter-spacing="1">IAM / AAD</text>
    <!-- Tag 3 -->
    <rect x="250" y="0" width="100" height="28" rx="14" fill="#0078d4" opacity="0.2"/>
    <rect x="250" y="0" width="100" height="28" rx="14" fill="none" stroke="#0078d4" stroke-width="1"/>
    <text x="300" y="19" text-anchor="middle" font-size="12" fill="#4fc3f7" letter-spacing="1">MFA / RBAC</text>
    <!-- Tag 4 -->
    <rect x="365" y="0" width="130" height="28" rx="14" fill="#0078d4" opacity="0.2"/>
    <rect x="365" y="0" width="130" height="28" rx="14" fill="none" stroke="#00bcf2" stroke-width="1"/>
    <text x="430" y="19" text-anchor="middle" font-size="12" fill="#4fc3f7" letter-spacing="1">POLICY DESIGN</text>
  </g>

  <!-- Corner dots decoration -->
  <circle cx="15" cy="15" r="3" fill="#0078d4" opacity="0.5"/>
  <circle cx="30" cy="15" r="2" fill="#0078d4" opacity="0.3"/>
  <circle cx="15" cy="30" r="2" fill="#0078d4" opacity="0.3"/>

  <circle cx="1265" cy="15" r="3" fill="#00bcf2" opacity="0.5"/>
  <circle cx="1250" cy="15" r="2" fill="#00bcf2" opacity="0.3"/>
  <circle cx="1265" cy="30" r="2" fill="#00bcf2" opacity="0.3"/>

  <circle cx="15" cy="385" r="3" fill="#0078d4" opacity="0.5"/>
  <circle cx="30" cy="385" r="2" fill="#0078d4" opacity="0.3"/>
  <circle cx="15" cy="370" r="2" fill="#0078d4" opacity="0.3"/>

  <circle cx="1265" cy="385" r="3" fill="#00bcf2" opacity="0.5"/>
  <circle cx="1250" cy="385" r="2" fill="#00bcf2" opacity="0.3"/>
  <circle cx="1265" cy="370" r="2" fill="#00bcf2" opacity="0.3"/>
</svg>
